name: Telegram channel export

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"   # запуск каждый день в 09:00 UTC

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Telegram export script
        run: |
          python tg_channel_to_excel.py

      - name: Commit exported Excel file
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Создаём папку export если её нет
          mkdir -p export

          # Копируем файл в папку export
          cp channel_messages.xlsx export/channel_messages.xlsx

          git add export/channel_messages.xlsx

          # Если нет изменений — не коммитим
          git diff --cached --quiet || git commit -m "Update export: $(date)"

          git push
